version: 1
frontend:
  environment:
    variables:
      _CUSTOM_IMAGE: amplify:al2023
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'X-Frame-Options'
          value: 'DENY'
        - key: 'X-Content-Type-Options'
          value: 'nosniff'
  rewritesAndRedirects:
    # Static pages
    - source: '/ancientworld/about/'
      target: '/about/index.html'
      status: '200'
    - source: '/ancientworld/about'
      target: '/about/index.html'
      status: '200'
    - source: '/ancientworld/collectionsoverview/'
      target: '/collectionsoverview/index.html'
      status: '200'
    - source: '/ancientworld/collectionsoverview'
      target: '/collectionsoverview/index.html'
      status: '200'
    - source: '/ancientworld/partners/'
      target: '/partners/index.html'
      status: '200'
    - source: '/ancientworld/partners'
      target: '/partners/index.html'
      status: '200'
    - source: '/ancientworld/providers/'
      target: '/providers/index.html'
      status: '200'
    - source: '/ancientworld/providers'
      target: '/providers/index.html'
      status: '200'
    - source: '/ancientworld/series/'
      target: '/series/index.html'
      status: '200'
    - source: '/ancientworld/series'
      target: '/series/index.html'
      status: '200'
    - source: '/ancientworld/subjects/'
      target: '/subjects/index.html'
      status: '200'
    - source: '/ancientworld/subjects'
      target: '/subjects/index.html'
      status: '200'
    - source: '/ancientworld/'
      target: '/index.html'
      status: '200'
    - source: '/ancientworld'
      target: '/index.html'
      status: '200'
    # SSR pages - route to server handler
    - source: '/ancientworld/books/<*>'
      target: '/compute/default/entry.mjs'
      status: '200'
    - source: '/ancientworld/series/<*>'
      target: '/compute/default/entry.mjs'
      status: '200'
    - source: '/ancientworld/subjects/<*>'
      target: '/compute/default/entry.mjs'
      status: '200'
    - source: '/ancientworld/providers/<*>'
      target: '/compute/default/entry.mjs'
      status: '200'
    - source: '/ancientworld/search/<*>'
      target: '/compute/default/entry.mjs'
      status: '200'
    - source: '/ancientworld/browse/<*>'
      target: '/compute/default/entry.mjs'
      status: '200'
