version: 1
frontend:
  phases:
    preBuild:
      commands:
        - git checkout ancientworld-astro
        - node --version
        - npm --version
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
