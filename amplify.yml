version: 1
frontend:
  environment:
    variables:
      _CUSTOM_IMAGE: amplify:al2023
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
